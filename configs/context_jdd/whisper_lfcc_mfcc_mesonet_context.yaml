data:
  name: jdd_context
model:
  class: whisper_lfcc_mfcc_frontend_mesonet_context
  id: whisper_lfcc_mfcc_mesonet_context
  parameters:
    context: ct
    fc1_dim: 1024
    freeze_encoder: true
    frontend_algorithm:
